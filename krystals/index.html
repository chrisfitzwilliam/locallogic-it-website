<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Krystal's Produce - Fresh Local Missouri-Grown Produce, Plants & Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&family=Caveat:wght@500;700&family=Bree+Serif&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.lordicon.com/lordicon.js"></script>
<style>
  :root{
    --yellow:#FFC43F;
    --yellow-soft:#FFEFC2;
    --green:#E10E1A;
    --green-deep:#1F1F1F;
    --green-pale:#FBE5E5;
    --orange:#E10E1A;
    --ink:#222222;
    --ink-2:#333333;
    --muted:#777777;
    --line:#EFEFEF;
    --paper:#FAF8F2;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Open Sans", system-ui, sans-serif;
    color:var(--ink);
    background:#fff;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
    overflow-x:hidden;
  }
  h1,h2,h3,h4{font-family:"Inter", sans-serif; color:var(--ink); margin:0; line-height:1.1; letter-spacing:-0.01em}
  a{color:inherit; text-decoration:none}
  img{max-width:100%; display:block}
  .container{max-width:1320px; margin:0 auto; padding:0 32px}
  .hairline{border:0; height:1px; background:var(--line); margin:0}
  /* === TOP UTILITY BAR === */
  .util{
    background:var(--green-deep); color:#fff;
    font-size:13px; padding:8px 0;
  }
  .util .container{display:flex; justify-content:space-between; align-items:center; gap:24px;}
  .util .left{display:flex; gap:22px; flex-wrap:wrap}
  .util .left span{display:inline-flex; align-items:center; gap:8px; opacity:.92}
  .util .dot{width:6px;height:6px;border-radius:50%;background:#FFC43F;display:inline-block}
  .util .right{display:flex; gap:18px; opacity:.85}
  .util .right a:hover{opacity:1; color:var(--yellow)}
  /* === NAV === */
  .nav{
    background:#fff; position:sticky; top:0; z-index:50;
    border-bottom:1px solid var(--line);
    transition:box-shadow .2s ease;
  }
  .nav.scrolled{box-shadow:0 4px 18px rgba(0,0,0,0.06)}
  .nav .container{display:flex; align-items:center; gap:36px; padding-top:18px; padding-bottom:18px}
  .brand{display:flex; align-items:center; gap:10px}
  .brand img{height:54px; width:auto; display:block}
  .brand-foot img{height:48px}
  .nav-links{display:flex; gap:30px; margin-left:auto; font-family:"Open Sans"; font-weight:600; font-size:15px; color:var(--ink-2)}
  .nav-links a{padding:8px 2px; position:relative; cursor:pointer}
  .nav-links a.active{color:var(--green)}
  .nav-links a.active::after{content:""; position:absolute; left:0; right:0; bottom:-19px; height:3px; background:var(--green); border-radius:2px}
  .nav-links a:hover{color:var(--green)}
  .nav .cta{
    background:var(--green); color:#fff; padding:11px 18px; border-radius:10px;
    font-weight:600; font-size:14px; letter-spacing:.04em;
    display:inline-flex; gap:8px; align-items:center;
    transition:transform .15s ease, background .15s ease;
  }
  .nav .cta.green{background:#269b24}
  .nav .cta:hover{background:var(--green-deep); transform:translateY(-1px)}
  .nav-btns{display:flex; gap:10px; align-items:center; margin-left:auto}
  @media (min-width:1101px){
    .nav-btns{margin-left:0}
  }
  /* === HERO === */
  .hero{
    background:var(--yellow);
    position:relative; overflow:hidden;
  }
  .hero .container{display:grid; grid-template-columns:1.1fr .9fr; gap:48px; padding-top:42px; padding-bottom:96px; align-items:start}
  .hero .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.6); border:1px solid rgba(54,65,39,.15);
    padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:600; color:var(--green-deep);
    letter-spacing:.04em;
  }
  .hero .eyebrow .pulse{width:8px;height:8px;border-radius:50%;background:#27a04a; box-shadow:0 0 0 0 rgba(39,160,74,.6); animation:pulse 1.8s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(39,160,74,.55)}70%{box-shadow:0 0 0 10px rgba(39,160,74,0)}100%{box-shadow:0 0 0 0 rgba(39,160,74,0)}}
  .hero h1{
    font-family:"Inter"; font-weight:800;
    font-size:clamp(40px, 5.6vw, 78px);
    line-height:1.02; letter-spacing:-0.025em;
    margin-top:18px; color:#1a1f0e;
  }
  .hero h1 em{font-style:normal; color:var(--green-deep); font-family:"Caveat"; font-weight:700; font-size:.85em; letter-spacing:0}

  /* --- Dropping Texts Animation --- */
  .dropping-texts {
    display: inline-block;
    width: auto;
    min-width: 260px;
    text-align: left;
    height: 1.1em;
    vertical-align: bottom;
    position: relative;
    margin-left: 0.2em;
  }
  .dropping-texts > div {
    font-family: "Bree Serif", serif;
    font-size: 0px;
    opacity: 0;
    position: absolute;
    left: 0;
    top: 0;
    font-weight: 400;
    white-space: nowrap;
    line-height: 1;
  }
  .dropping-texts > div:nth-child(1) { animation: roll 7.5s linear infinite 0s; color: #d06a28; }
  .dropping-texts > div:nth-child(2) { animation: roll 7.5s linear infinite 2.5s; color: #269b24; }
  .dropping-texts > div:nth-child(3) { animation: roll 7.5s linear infinite 5s; color: #e10e1a; }

  @keyframes roll {
    0% { font-size:0px; opacity:0; transform: translateY(-50px) rotate(-15deg); }
    3% { opacity:1; transform: translateY(0) rotate(0deg); }
    5% { font-size:inherit; opacity:1; }
    30% { font-size:inherit; opacity:1; transform: translateY(0) rotate(0deg); }
    35% { font-size:0px; opacity:0; transform: translateY(50px) rotate(10deg); }
    100% { font-size:0px; opacity:0; }
  }

  .hero p.lede{font-size:18px; max-width:520px; margin-top:18px; color:#3a3a2c}
  .hero .actions{display:flex; gap:14px; margin-top:28px; flex-wrap:wrap}
  .pickup-card{
    max-width:720px; display:grid; grid-template-columns:104px 1fr 104px;
    gap:18px; align-items:center; background:#fff; border:2px solid rgba(31,31,31,.08);
    border-radius:18px; padding:18px 20px; box-shadow:0 18px 38px rgba(0,0,0,.12);
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  .pickup-card:hover{transform:translateY(-3px); box-shadow:0 24px 48px rgba(0,0,0,.16); border-color:rgba(225,14,26,.28)}
  .pickup-card lord-icon{width:96px;height:96px}
  .pickup-card .copy{text-align:center}
  .pickup-card .kicker{font-size:12px; font-weight:800; color:var(--green); letter-spacing:.08em; text-transform:uppercase}
  .pickup-card h3{font-size:22px; margin-top:3px}
  .pickup-card p{font-size:14px; color:var(--muted); margin:6px 0 0; line-height:1.45}
  .pickup-card .card-btn{
    display:inline-flex; align-items:center; justify-content:center; margin-top:12px;
    background:var(--green); color:#fff; border-radius:10px; padding:10px 16px;
    font-weight:800; font-size:13px; letter-spacing:.03em;
    box-shadow:0 10px 18px rgba(225,14,26,.22);
  }
  .pickup-card:hover .card-btn{background:var(--green-deep)}
  .banners-pickup{grid-column:1 / -1; display:flex; justify-content:center; margin-top:52px}
  .banners-pickup .pickup-card{width:min(100%, 760px)}
  .btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:14px 22px; border-radius:12px; font-weight:600; font-size:15px;
    cursor:pointer; border:0; font-family:inherit;
    transition:transform .15s, background .15s, color .15s;
  }
  .btn-primary{background:var(--green); color:#fff}
  .btn-primary:hover{background:var(--green-deep); transform:translateY(-1px)}
  .btn-dark{background:var(--green-deep); color:#fff}
  .btn-dark:hover{background:#1f2614; transform:translateY(-1px)}
  .btn-ghost{background:transparent; border:1.5px solid var(--green-deep); color:var(--green-deep)}
  .btn-ghost:hover{background:var(--green-deep); color:#fff}
  .hero .stats{display:flex; gap:36px; margin-top:36px}
  .hero .stats .n{font-family:"Inter"; font-weight:700; font-size:30px; color:var(--green-deep); line-height:1}
  .hero .stats .l{font-size:13px; color:#5a5d44; margin-top:6px}
  .hero-img{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.25), 0 12px 30px -12px rgba(0,0,0,.18);
    aspect-ratio: 16/10;
  }
  .hero-img img{width:100%; height:100%; object-fit:cover}
  .hero-media{display:grid; gap:18px; margin-top:-12px}
  .hero-map{
    border:0;
    border-radius:18px;
    width:100%;
    aspect-ratio:16/10;
    min-height:0;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.22), 0 12px 30px -12px rgba(0,0,0,.16);
    display:block;
  }
  .hero-tag{
    position:absolute; left:-18px; top:24px;
    background:#fff; padding:14px 18px; border-radius:14px;
    box-shadow:0 12px 24px rgba(0,0,0,.12);
    font-family:"Caveat"; font-weight:700; font-size:24px; color:var(--green-deep);
    transform:rotate(-4deg);
  }
  .hero-tag .sub{display:block; font-family:"Open Sans"; font-weight:600; font-size:11px; letter-spacing:.12em; color:var(--orange); margin-top:-4px}
  .hero-pricecard{
    position:absolute; right:-14px; bottom:24px;
    background:#fff; border-radius:14px; padding:14px 18px;
    box-shadow:0 18px 32px rgba(0,0,0,.18);
    display:flex; gap:14px; align-items:center;
  }
  .hero-pricecard .ribbon{
    width:40px;height:40px;border-radius:8px; background:var(--orange); color:#fff;
    display:grid; place-items:center; font-weight:800; font-family:"Inter"; font-size:18px;
  }
  .hero-pricecard .t{font-family:"Inter"; font-weight:700; font-size:15px}
  .hero-pricecard .s{font-size:12px; color:var(--muted)}
  /* Banners (3-up) overlap */
  .banners{
    margin-top:-58px; position:relative; z-index:5;
    display:grid; grid-template-columns:repeat(3, 330px); justify-content:center; gap:18px;
  }
  .ban{
    width:330px; min-height:92px; max-width:100%; border-radius:8px; box-sizing:border-box; padding:16px 20px;
    background:#fff; border:4px solid var(--card-accent-soft); box-shadow:rgba(149,157,165,.2) 0 8px 24px;
    position:relative; overflow:hidden; display:flex; align-items:center;
    justify-content:flex-start; gap:16px; color:var(--ink);
  }
  .ban .wave{
    position:absolute; transform:rotate(90deg); left:-31px; top:32px;
    width:80px; fill:var(--card-accent-wash);
  }
  .ban .ic{
    width:35px; height:35px; display:flex; justify-content:center; align-items:center;
    background:var(--card-accent-wash); border-radius:50%; margin-left:8px; flex-shrink:0;
  }
  .ban .ic svg{width:22px;height:22px;display:block;color:var(--card-accent)}
  .ban .message-text-container{
    display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
    flex-grow:1; min-width:0; position:relative; z-index:1;
  }
  .ban .message-text,
  .ban .sub-text{margin:0; cursor:default}
  .ban .message-text{color:var(--card-accent); font-size:17px; font-weight:700; line-height:1.15}
  .ban .sub-text{font-size:14px; color:#555; line-height:1.35}
  .ban-1{--card-accent:#d06a28; --card-accent-soft:rgba(208,106,40,.34); --card-accent-wash:rgba(208,106,40,.16)}
  .ban-2{--card-accent:#269b24; --card-accent-soft:rgba(38,155,36,.34); --card-accent-wash:rgba(38,155,36,.16)}
  .ban-3{--card-accent:#e10e1a; --card-accent-soft:rgba(225,14,26,.32); --card-accent-wash:rgba(225,14,26,.14)}
  /* Section header */
  .sec{padding:96px 0}
  .sec-head{display:flex; align-items:end; justify-content:space-between; margin-bottom:36px; gap:24px; flex-wrap:wrap}
  .sec-head .tag{font-family:"Caveat"; color:var(--green); font-size:24px; font-weight:700; line-height:1}
  .sec-head h2{font-family:"Inter"; font-weight:700; font-size:42px; letter-spacing:-0.02em; margin-top:6px}
  .sec-head p{color:var(--muted); margin-top:8px; max-width:540px; font-size:15.5px}
  .sec-head .right{display:flex; gap:8px; align-items:center}
  .pager-btn{
    width:42px;height:40px;border-radius:10px;background:#F1F1F1; border:0;
    display:grid; place-items:center; cursor:pointer; transition:background .15s;
  }
  .pager-btn:hover{background:#E4E4E4}
  .pager-btn.green{background:var(--green); color:#fff}
  .pager-btn.green:hover{background:var(--green-deep)}
  /* Categories */
  .cats{display:grid; grid-template-columns:repeat(7, 1fr); gap:24px}
  .cat{display:flex; flex-direction:column; align-items:center; gap:14px; cursor:pointer; padding:8px 4px}
  .cat .circle{
    width:100%; max-width:118px; aspect-ratio:1/1; border-radius:50%; overflow:hidden;
    background:var(--green-pale);
    box-shadow:0 8px 18px rgba(0,0,0,0.06);
    transition:transform .25s ease, box-shadow .25s ease;
    position:relative;
  }
  .cat .circle img{width:100%;height:100%;object-fit:cover}
  .cat:hover .circle{transform:translateY(-6px); box-shadow:0 16px 30px rgba(0,0,0,.14)}
  .cat .nm{font-weight:600; font-size:14.5px; color:var(--ink-2)}
  /* Product cards */
  .fresh-scroll{
    overflow:hidden; margin:0 -32px; padding:6px 32px 18px;
    cursor:pointer;
  }
  .fresh-track{
    display:flex; gap:24px; width:max-content;
    animation:freshMarquee 55s linear infinite;
  }
  .fresh-scroll:hover .fresh-track,
  .fresh-scroll:focus-within .fresh-track,
  .fresh-scroll.paused .fresh-track{animation-play-state:paused}
  @keyframes freshMarquee{
    from{transform:translateX(0)}
    to{transform:translateX(calc(-50% - 12px))}
  }
  .prod{
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:18px; transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    position:relative; overflow:hidden;
    width:290px; flex:0 0 290px;
  }
  .prod:hover{transform:translateY(-4px); box-shadow:0 18px 36px rgba(0,0,0,.10); border-color:transparent}
  .prod .ph{
    width:100%; aspect-ratio:1/1; border-radius:12px; overflow:hidden; background:var(--green-pale);
    margin-bottom:14px; position:relative;
  }
  .prod .ph img{width:100%; height:100%; object-fit:cover; transition:transform .35s}
  .prod:hover .ph img{transform:scale(1.05)}
  .prod .badge{
    position:absolute; top:10px; left:10px;
    background:var(--orange); color:#fff; font-size:11px; font-weight:700;
    padding:5px 10px; border-radius:999px; letter-spacing:.06em;
  }
  .prod .badge.green{background:var(--green)}
  .prod .badge.dark{background:var(--green-deep)}
  .prod .nm{font-family:"Inter"; font-weight:600; font-size:17px; margin-bottom:4px}
  .prod .meta{font-size:13px; color:var(--muted); margin-bottom:12px}
  .prod .row{display:flex; justify-content:space-between; align-items:center}
  .prod .price{font-family:"Open Sans"; font-weight:700; font-size:18px; color:var(--ink)}
  .prod .price s{color:var(--muted); font-size:13px; margin-right:6px; font-weight:600}
  .prod .add{
    width:36px;height:36px;border-radius:10px;background:var(--paper); border:0;
    display:grid; place-items:center; cursor:pointer; transition:background .15s;
  }
  .prod:hover .add{background:var(--green); color:#fff}
  /* Story strip - alternating photo-and-quote */
  .story{
    background:var(--paper); padding:96px 0;
  }
  .story-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:64px; align-items:center}
  .story h2{font-size:46px; line-height:1.05}
  .story p{color:#4a4a3e; font-size:16.5px; line-height:1.7; margin-top:18px}
  .story .pull{
    border-left:3px solid var(--green); padding:8px 0 8px 18px; margin-top:24px;
    font-family:"Caveat"; font-weight:700; font-size:24px; color:var(--green-deep);
  }
  .story .frame{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
  }
  .story .frame img{border-radius:14px; width:100%; height:100%; object-fit:cover; aspect-ratio:3/4; box-shadow:0 14px 28px rgba(0,0,0,.10)}
  .story .frame .tall{aspect-ratio:3/4.4}
  .story .frame .col{display:flex; flex-direction:column; gap:14px}
  .story .frame .col img:first-child{aspect-ratio:3/2.4}
  .story .frame .col img:last-child{aspect-ratio:3/2.6}
  /* Pantry section */
  .pantry{background:var(--green-deep); color:#fff; padding:96px 0; position:relative; overflow:hidden}
  .pantry::before{content:""; position:absolute; right:-120px; top:-120px; width:380px; height:380px; border-radius:50%; background:rgba(255,196,63,.08)}
  .pantry .container{position:relative; z-index:2}
  .pantry .sec-head h2{color:#fff; font-size:46px}
  .pantry .sec-head .tag{color:var(--yellow)}
  .pantry .sec-head p{color:#cfd3c2}
  .pantry-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; margin-top:8px}
  .pantry-card{
    background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.12); border-radius:18px;
    padding:24px; backdrop-filter:blur(4px);
    display:flex; flex-direction:column;
    transition:background .2s, transform .2s;
  }
  .pantry-card:hover{background:rgba(255,255,255,.07); transform:translateY(-4px)}
  .pantry-card .ph{border-radius:12px; overflow:hidden; aspect-ratio:4/3; margin-bottom:18px}
  .pantry-card .ph img{width:100%;height:100%;object-fit:cover}
  .pantry-card.big{grid-row:auto}
  .pantry-card h3{color:#fff; font-size:22px}
  .pantry-card p{color:#cfd3c2; font-size:14px; margin-top:6px}
  .pantry-card .pill{
    align-self:flex-start; background:var(--yellow); color:#1a1f0e; font-weight:700; font-size:11.5px; letter-spacing:.08em;
    padding:6px 12px; border-radius:999px; margin-bottom:12px;
  }
  .chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px}
  .chip{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); padding:6px 12px; border-radius:999px; font-size:12.5px; color:#dfe3d4}
  /* Visit / hours */
  .visit{padding:96px 0; background:#fff}
  .visit-grid{display:grid; grid-template-columns:1fr 1fr; gap:48px}
  .hours-card{
    background:var(--paper); border-radius:20px; padding:36px; border:1px solid var(--line);
    display:flex; flex-direction:column; gap:20px;
  }
  .hours-card h3{font-family:"Inter"; font-size:28px}
  .hours-row{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px dashed #DCDDD0; font-size:15px}
  .hours-row:last-of-type{border-bottom:0}
  .hours-row .d{font-weight:600}
  .hours-row .t{font-family:"Inter"; font-weight:600; color:var(--green-deep)}
  .hours-row.today{background:var(--yellow-soft); margin:0 -16px; padding:14px 16px; border-radius:10px; border-bottom:0}
  .hours-row.today .t{color:var(--orange)}
  .open-now{
    display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
    background:var(--green); color:#fff; padding:8px 14px; border-radius:999px;
    font-size:13px; font-weight:700; letter-spacing:.05em;
  }
  .map-card{
    border-radius:20px; overflow:hidden; background:#fff;
    position:relative; min-height:420px;
    border:1px solid var(--line);
    display:flex; align-items:end; justify-content:start;
    padding:24px;
  }
  .map-card .sign{position:absolute; left:0; right:0; top:0; bottom:120px; width:100%; height:auto; max-height:calc(100% - 120px); object-fit:contain; padding:24px}
  .map-card .pin{
    position:absolute; left:42%; top:38%;
    width:48px;height:48px;border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    background:var(--orange); display:grid; place-items:center;
    box-shadow:0 18px 26px rgba(249,95,9,.35);
    animation:bob 2s ease-in-out infinite;
  }
  .pin::after{content:""; width:14px;height:14px;background:#fff;border-radius:50%}

function App(){
  const [active, setActive] = useState('Home');
  const [tweaks, setTweaks] = useState(TWEAKS);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  // Tweaks protocol
  useEffect(()=>{
    const onMsg=(e)=>{
      if(!e.data || typeof e.data!=='object') return;
      if(e.data.type==='__activate_edit_mode') setTweaksOpen(true);
      if(e.data.type==='__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({type:'__edit_mode_available'}, '*');
    return ()=>window.removeEventListener('message', onMsg);
  },[]);

  const setTweak = (k,v)=>{
    setTweaks(t=>{const n={...t,[k]:v}; window.parent.postMessage({type:'__edit_mode_set_keys', edits:{[k]:v}}, '*'); return n;});
  };

  // Theme accent
  useEffect(()=>{
    const root=document.documentElement;
    if(tweaks.accent==='yellow'){root.style.setProperty('--yellow','#FFC43F'); root.style.setProperty('--orange','#F95F09');}
    if(tweaks.accent==='peach'){root.style.setProperty('--yellow','#F4B26A'); root.style.setProperty('--orange','#D9603F');}
    if(tweaks.accent==='cream'){root.style.setProperty('--yellow','#F5E9C4'); root.style.setProperty('--orange','#C66A2C');}
  },[tweaks.accent]);

  return (
    <>
      <Nav active={active} setActive={setActive}/>
      <Hero tweaks={tweaks}/>
      <Banners/>
      <Categories/>
      <WhatsFresh/>
      <Story/>
      <Pantry/>
      <VisitUs/>
      <Newsletter/>
      <Footer/>
      {tweaksOpen && (
        <div style={{
          position:'fixed', right:24, bottom:24, width:280,
          background:'#fff', border:'1px solid #E2E2E2', borderRadius:14,
          padding:18, boxShadow:'0 24px 48px rgba(0,0,0,.18)', zIndex:300, fontFamily:'"Open Sans"'
        }}>
          <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
            <strong style={{fontFamily:'"Inter"', fontSize:15}}>Tweaks</strong>
            <button onClick={()=>{setTweaksOpen(false); window.parent.postMessage({type:'__edit_mode_dismissed'},'*');}} style={{border:0, background:'transparent', cursor:'pointer', fontSize:18, color:'#999'}}>x</button>
          </div>
          <div style={{fontSize:12, color:'#666', marginBottom:8, fontWeight:600, textTransform:'uppercase', letterSpacing:'.06em'}}>Hero Accent</div>
          <div style={{display:'flex', gap:8, marginBottom:18}}>
            {[['yellow','#FFC43F'],['peach','#F4B26A'],['cream','#F5E9C4']].map(([k,c])=>(
              <button key={k} onClick={()=>setTweak('accent',k)} style={{
                flex:1, height:36, borderRadius:8, border:tweaks.accent===k?'2px solid #364127':'1px solid #E2E2E2',
                background:c, cursor:'pointer', fontWeight:600, fontSize:12, color:'#1a1f0e', textTransform:'capitalize'
              }}>{k}</button>
            ))}
          </div>
          <label style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:13, marginBottom:10}}>
            <span>Show "Today's Pick" card</span>
            <input type="checkbox" checked={tweaks.showHeroPriceCard} onChange={(e)=>setTweak('showHeroPriceCard', e.target.checked)}/>
          </label>
          <label style={{display:'flex', justifyContent:'space-between', alignItems:'center', fontSize:13}}>
            <span>Show stat row</span>
            <input type="checkbox" checked={tweaks.showStats} onChange={(e)=>setTweak('showStats', e.target.checked)}/>
          </label>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
