<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Manrope", sans-serif;
      background: radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #07070f 100%);
    }

    /* ── Header ── */
    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 0;
      pointer-events: none;
    }
    .header-logo { display: flex; align-items: center; gap: 12px; }
    .header-logo img { height: 40px; width: auto; }
    .header-name { font-size: 1.3rem; font-weight: 800; color: #fff; letter-spacing: -0.02em; }
    .header-tagline {
      margin-top: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Chooser layout ── */
    @keyframes chooser-fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .chooser {
      display: flex;
      gap: 14px;
      padding: 88px 40px 36px;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      animation: chooser-fade-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    /* ── Half panels ── */
    .half {
      position: relative;
      flex: 1;
      overflow: hidden;
      border-radius: 14px;
      cursor: pointer;
      outline: none;
      /* Subtle brand-colored border */
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.07);
    }
    .half--residential { box-shadow: inset 0 0 0 1px rgba(201,169,110,0.25); }
    .half--business    { box-shadow: inset 0 0 0 1px rgba(59,130,246,0.25);  }
    .half:focus-visible {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.55);
    }

    /* ── Scaled iframe preview ── */
    .half-preview {
      position: absolute;
      top: 0; left: 0;
      border: none;
      display: block;
      pointer-events: none; /* non-interactive in preview mode */
      transform-origin: 0 0;
    }

    /* ── Dim overlay — fades on hover to reveal the preview ── */
    .half-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      transition: opacity 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .half--residential .half-overlay { background: rgba(6,8,16,0.58); }
    .half--business    .half-overlay { background: rgba(6,8,16,0.58); }

    .half:hover .half-overlay { opacity: 0.06; }

    /* ── Caption at bottom ── */
    .half-caption {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 3;
      padding: 64px 24px 24px;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      transition: opacity 0.38s ease;
    }
    .half-name {
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .half--residential .half-name { color: #C9A96E; }
    .half--business    .half-name { color: #3B82F6; }
    .half-sub {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
    }

    /* ── Selection state: FLIP expands panel to fullscreen ── */
    .half.is-selecting {
      position: fixed !important;
      inset: 0 !important;
      z-index: 100;
      flex: none;
      overflow: hidden;
    }
    .half.is-selecting .half-overlay  { opacity: 0 !important; }
    .half.is-selecting .half-caption  { opacity: 0 !important; }

    /* Hide the other panel when one is being selected */
    .chooser.has-selection .half:not(.is-selecting) {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    /* ── Responsive: mobile stacks vertically ── */
    @media (max-width: 767px) {
      html, body { overflow: auto; }
      .chooser {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        padding: 80px 20px 20px;
        gap: 12px;
      }
      .half { min-height: 42vh; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-logo">
      <img src="assets/logo.png" alt="Local Logic IT logo" />
      <span class="header-name">Local Logic IT</span>
    </div>
    <p class="header-tagline">Local Service. Logical Solutions.</p>
  </header>

  <main class="chooser" id="chooser">

    <!-- Residential preview panel -->
    <div class="half half--residential"
         role="link" tabindex="0"
         aria-label="Residential IT Support — Home and Family"
         data-href="residential.html">
      <iframe class="half-preview"
              src="residential.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Residential site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="half-caption">
        <span class="half-name">Home &amp; Family</span>
        <span class="half-sub">Residential IT Support</span>
      </div>
    </div>

    <!-- Business preview panel -->
    <div class="half half--business"
         role="link" tabindex="0"
         aria-label="Business IT Services — Business and Office"
         data-href="business.html">
      <iframe class="half-preview"
              src="business.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Business site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="half-caption">
        <span class="half-name">Business &amp; Office</span>
        <span class="half-sub">Commercial IT Services</span>
      </div>
    </div>

  </main>

  <script>
    var REF_W = 1440; // reference render width for the iframe pages

    // Scale each iframe to fill its panel at full desktop width
    function scalePreview(half) {
      var iframe = half.querySelector('.half-preview');
      if (!iframe) return;
      var W = half.offsetWidth;
      var H = half.offsetHeight;
      var scale = W / REF_W;
      iframe.style.width  = REF_W + 'px';
      iframe.style.height = Math.ceil(H / scale) + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    }

    function init() {
      var chooser = document.getElementById('chooser');
      var halves  = document.querySelectorAll('.half');

      // Initial scale pass
      halves.forEach(scalePreview);

      halves.forEach(function(half) {

        function selectHalf() {
          if (chooser.classList.contains('has-selection')) return; // prevent double-fire
          var dest = half.dataset.href;

          // 1. Snapshot the card's current viewport position
          var cardRect = half.getBoundingClientRect();

          // 2. Mark chooser (hides the other panel)
          chooser.classList.add('has-selection');

          // 3. Expand the panel to cover the full viewport (position: fixed; inset: 0)
          half.classList.add('is-selecting');

          // 4. Measure its new (fullscreen) position
          var fullRect = half.getBoundingClientRect();

          // 5. Compute inverse FLIP transform — makes it visually appear at card position
          var sx = cardRect.width  / fullRect.width;
          var sy = cardRect.height / fullRect.height;
          var tx = cardRect.left   - fullRect.left;
          var ty = cardRect.top    - fullRect.top;

          // Apply inverse transform instantly (no transition yet)
          half.style.borderRadius = '14px'; // keep rounded at start of FLIP
          half.style.transition   = 'none';
          half.style.transform    = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + sx + ', ' + sy + ')';

          // Force reflow so the browser registers the starting state
          void half.offsetHeight;

          // Re-scale iframe for full viewport size
          scalePreview(half);

          // 6. Play FLIP: animate from card position → fullscreen
          half.style.transition   = 'transform 0.46s cubic-bezier(0.4, 0, 0.2, 1), border-radius 0.46s ease';
          half.style.transform    = 'translate(0,0) scale(1,1)';
          half.style.borderRadius = '0';

          // Navigate once the expansion is visually complete
          setTimeout(function() {
            window.location.href = dest;
          }, 420);
        }

        half.addEventListener('click', selectHalf);
        half.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectHalf();
          }
        });
      });

      // Re-scale on resize
      window.addEventListener('resize', function() {
        halves.forEach(scalePreview);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
