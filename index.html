<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Manrope", sans-serif;
      background: linear-gradient(90deg, #F0F0F4 0%, #F0F0F4 50%, #F4F0EC 50%, #F4F0EC 100%);
    }

    /* ── Flash animation (injected on click) ── */
    @keyframes flash-out {
      0%   { opacity: 0.8; }
      100% { opacity: 0;   }
    }

    @keyframes header-arrive {
      from {
        opacity: 0;
        transform: translate(-50%, -10px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) scale(1);
      }
    }
    @keyframes header-flare {
      0%, 28% { transform: translateX(-135%) skewX(-18deg); opacity: 0; }
      38%     { opacity: 0.55; }
      56%     { transform: translateX(135%) skewX(-18deg); opacity: 0; }
      100%    { transform: translateX(135%) skewX(-18deg); opacity: 0; }
    }

    /* ── Header — frosted glass pill ── */
    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      will-change: left, top, transform;
      display: flex;
      align-items: center;
      gap: 14px;
      width: min(720px, calc(100vw - 36px));
      min-height: 62px;
      padding: 8px 10px 8px 18px;
      background:
        linear-gradient(135deg, rgba(10,11,24,0.94), rgba(17,18,38,0.88)) padding-box,
        linear-gradient(112deg, rgba(212,114,42,0.72), rgba(255,255,255,0.28), rgba(91,94,204,0.74)) border-box;
      border: 1px solid transparent;
      border-radius: 999px;
      box-shadow:
        0 18px 48px rgba(0,0,0,0.36),
        0 0 28px rgba(212,114,42,0.14),
        0 0 32px rgba(91,94,204,0.15),
        inset 0 1px 0 rgba(255,255,255,0.14);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      white-space: nowrap;
      pointer-events: auto;
      overflow: visible;
      animation: header-arrive 0.7s cubic-bezier(0.19,1,0.22,1) both 0.08s;
    }
    .header::before {
      content: "";
      position: absolute;
      inset: 1px;
      z-index: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(212,114,42,0.08), transparent 36%, rgba(91,94,204,0.08));
    }
    .header::after {
      content: "";
      position: absolute;
      top: 1px;
      bottom: 1px;
      left: 0;
      z-index: 0;
      width: 96px;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
      filter: blur(1px);
      animation: header-flare 6.8s ease-in-out infinite 1.1s;
    }
    .header > * {
      position: relative;
      z-index: 1;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      text-decoration: none;
    }
    .header-brand:focus-visible,
    .header-link:focus-visible,
    .header-choice:focus-visible {
      outline: 2px solid rgba(255,255,255,0.86);
      outline-offset: 3px;
      border-radius: 999px;
    }
    .header-logo {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 24%, rgba(255,255,255,0.18), rgba(255,255,255,0.03) 58%);
      box-shadow:
        0 0 20px rgba(212,114,42,0.24),
        0 0 22px rgba(91,94,204,0.18);
      flex-shrink: 0;
    }
    .header-logo img { height: 34px; width: auto; display: block; }
    .header-name {
      font-size: 1.12rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .header-divider {
      width: 1px;
      height: 26px;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.3), transparent);
      flex-shrink: 0;
    }
    .header-tagline {
      font-size: 0.68rem;
      font-weight: 700;
      color: rgba(255,255,255,0.58);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex: 1 1 auto;
      min-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .header-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .header-link {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: transparent;
      color: rgba(255,255,255,0.72);
      font: inherit;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition:
        color 0.22s ease,
        background 0.22s ease,
        box-shadow 0.22s ease,
        transform 0.22s ease;
    }
    .header-link:hover,
    .header-link.is-active {
      color: #fff;
      background: linear-gradient(135deg, rgba(212,114,42,0.28), rgba(91,94,204,0.24));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.13);
    }
    .header-link:hover {
      transform: translateY(-1px);
    }
    .header-menu {
      position: absolute;
      top: calc(100% + 10px);
      right: 10px;
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: min(320px, calc(100vw - 36px));
      padding: 8px;
      background: rgba(9,10,23,0.94);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(0,0,0,0.34);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-6px) scale(0.98);
      transition:
        opacity 0.2s ease,
        visibility 0.2s ease,
        transform 0.2s ease;
    }
    .header.is-menu-open .header-menu {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }
    .header-choice {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 12px;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 800;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .header-choice:hover {
      transform: translateY(-1px);
      border-color: rgba(255,255,255,0.24);
    }
    .header-choice--home {
      background: linear-gradient(135deg, rgba(212,114,42,0.28), rgba(212,114,42,0.12));
    }
    .header-choice--business {
      background: linear-gradient(135deg, rgba(91,94,204,0.3), rgba(91,94,204,0.13));
    }

    /* ── Chooser — full-bleed, no gap ── */
    @keyframes chooser-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .chooser {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      animation: chooser-fade-in 0.6s ease both;
    }

    /* ── Halves — full-bleed ── */
    .half {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      outline: none;
    }
    /* Thin line between the two halves */
    .half--residential {
      box-shadow: inset -1px 0 0 rgba(255,255,255,0.08);
    }
    .half:focus-visible {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
    }

    /* ── Iframe preview ── */
    .half-preview {
      position: absolute;
      top: 0; left: 0;
      border: none;
      display: block;
      pointer-events: none;
      transform-origin: 0 0;
    }

    /* ── Dim overlay — very opaque + heavy blur (frosted glass over preview) ── */
    .half-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: rgba(4,6,14,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        opacity          0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        backdrop-filter  0.4s ease,
        -webkit-backdrop-filter 0.4s ease;
    }

    /* Hover: very slight frost lift — background stays mostly covered */
    .half:hover .half-overlay {
      opacity: 0.75;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ── Breathing glow animations for captions ── */
    @keyframes glow-gold {
      0%, 100% {
        box-shadow:
          0 0 22px rgba(212,114,42,0.18),
          0 8px 48px rgba(212,114,42,0.10),
          inset 0 1px 0 rgba(255,255,255,0.09);
      }
      50% {
        box-shadow:
          0 0 38px rgba(212,114,42,0.34),
          0 8px 64px rgba(212,114,42,0.20),
          inset 0 1px 0 rgba(255,255,255,0.13);
      }
    }
    @keyframes glow-blue {
      0%, 100% {
        box-shadow:
          0 0 22px rgba(91,94,204,0.18),
          0 8px 48px rgba(91,94,204,0.10),
          inset 0 1px 0 rgba(255,255,255,0.09);
      }
      50% {
        box-shadow:
          0 0 38px rgba(91,94,204,0.34),
          0 8px 64px rgba(91,94,204,0.20),
          inset 0 1px 0 rgba(255,255,255,0.13);
      }
    }

    /* ── Centered caption — premium glass card ── */
    .caption-wrapper {
      position: absolute;
      top: calc(50% + 26px);
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      border-radius: 18px;
      padding: 1.5px;
      overflow: hidden;
      pointer-events: none;
      white-space: nowrap;
      transition:
        transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity   0.38s ease;
    }
    .caption-wrapper::before {
      content: '';
      position: absolute;
      inset: -55%;
      opacity: 0.92;
      transform-origin: center;
      animation: border-sweep 5.2s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .caption-wrapper--residential::before {
      background: conic-gradient(from -45deg, transparent 0deg, transparent 205deg, rgba(212,114,42,0.2) 232deg, #D4722A 256deg, #F2B07D 276deg, #D4722A 296deg, rgba(212,114,42,0.2) 320deg, transparent 348deg);
    }
    .caption-wrapper--business::before {
      background: conic-gradient(from -45deg, transparent 0deg, transparent 205deg, rgba(91,94,204,0.2) 232deg, #5B5ECC 256deg, #9898FF 276deg, #5B5ECC 296deg, rgba(91,94,204,0.2) 320deg, transparent 348deg);
    }
    .half:hover .caption-wrapper::before {
      opacity: 1;
      filter: saturate(1.18) brightness(1.08);
      animation-duration: 3.4s;
    }
    @keyframes border-sweep {
      0%, 12%   { transform: rotate(-28deg); }
      44%, 56%  { transform: rotate(142deg); }
      88%, 100% { transform: rotate(332deg); }
    }
    .half-caption {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 36px 52px 32px;
      background: rgba(6,7,16,0.55);
      border-radius: 16.5px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: none;
      white-space: nowrap;
      border-top: 1px solid rgba(255,255,255,0.18);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: opacity 0.38s ease;
    }
    /* Brand-coloured glow + border accent */
    .half--residential .half-caption {
      border-color: rgba(212,114,42,0.32) rgba(212,114,42,0.14) rgba(212,114,42,0.08) rgba(212,114,42,0.14);
      animation: glow-gold 3.6s ease-in-out infinite;
    }
    .half--business .half-caption {
      border-color: rgba(91,94,204,0.32) rgba(91,94,204,0.14) rgba(91,94,204,0.08) rgba(91,94,204,0.14);
      animation: glow-blue 3.6s ease-in-out infinite;
    }

    .half:hover .caption-wrapper {
      transform: translate(-50%, -56%);
    }

    /* SVG icon above the label */
    .half-icon {
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
    }
    .half--residential .half-icon { color: #E8A870; }
    .half--business    .half-icon { color: #8B8FE8; }

    .half-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: block;
      margin-bottom: 5px;
    }
    .half--residential .half-name { color: #E8A870; }
    .half--business    .half-name { color: #8B8FE8; }

    .half-sub {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      display: block;
    }

    /* Hint arrow — fades in on hover ── */
    .half-arrow {
      display: block;
      margin-top: 18px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(5px);
      transition:
        opacity   0.3s ease,
        transform 0.3s ease;
    }
    .half--residential .half-arrow { color: rgba(212,114,42,0.85); }
    .half--business    .half-arrow { color: rgba(91,94,204,0.85);  }
    .half:hover .half-arrow {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Selection state — FLIP base ── */
    .half.is-selecting {
      position: fixed !important;
      inset: 0 !important;
      z-index: 100;
      flex: none;
      overflow: hidden;
    }
    .half.is-selecting .half-overlay  { opacity: 0 !important; transition: opacity 0.12s ease !important; }
    .half.is-selecting .caption-wrapper,
    .half.is-selecting .half-caption  { opacity: 0 !important; transition: opacity 0.08s ease !important; }

    /* Fade out the non-selected half */
    .chooser.has-selection .half:not(.is-selecting) {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    /* ── Responsive ── */
    @media (max-width: 860px) {
      .header {
        width: min(620px, calc(100vw - 24px));
        gap: 10px;
        padding-left: 12px;
      }
      .header-tagline {
        display: none;
      }
      .header-divider {
        display: none;
      }
    }

    @media (max-width: 767px) {
      html, body { overflow: auto; }
      .chooser { flex-direction: column; height: auto; min-height: 100vh; }
      .half { min-height: 44vh; }
      .half--residential { box-shadow: inset 0 -1px 0 rgba(255,255,255,0.08); }
      .header {
        top: 12px;
        align-items: center;
        justify-content: space-between;
        min-height: 58px;
      }
      .header-logo {
        width: 38px;
        height: 38px;
      }
      .header-logo img {
        height: 30px;
      }
      .header-name {
        font-size: 1rem;
      }
      .header-nav {
        gap: 4px;
        padding: 3px;
      }
      .header-link {
        padding: 7px 8px;
        font-size: 0.7rem;
      }
      .header-menu {
        right: 0;
      }
    }

    @media (max-width: 460px) {
      .header {
        width: calc(100vw - 18px);
        padding: 8px;
      }
      .header-brand {
        gap: 8px;
      }
      .header-name {
        max-width: 96px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .header-link {
        padding: 7px 6px;
        font-size: 0.66rem;
      }
    }

    @media (max-width: 380px) {
      .header-name {
        display: none;
      }
    }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .header, .header::after, .chooser, .half-overlay, .caption-wrapper::before, .half-caption, .half-arrow { animation: none; transition: none; }
    }
  </style>
</head>
<body>

  <!-- Frosted glass pill header -->
  <header class="header">
    <a class="header-brand" href="index.html" aria-label="Local Logic IT home">
      <span class="header-logo">
        <img src="assets/logo.png" alt="" />
      </span>
      <span class="header-name">Local Logic IT</span>
    </a>
    <div class="header-divider" aria-hidden="true"></div>
    <span class="header-tagline">Local Service. Logical Solutions.</span>
    <nav class="header-nav" aria-label="Quick sections">
      <button class="header-link" type="button" data-section="services" aria-haspopup="menu" aria-expanded="false" aria-controls="headerMenu">Services</button>
      <button class="header-link" type="button" data-section="about" aria-haspopup="menu" aria-expanded="false" aria-controls="headerMenu">About</button>
      <button class="header-link" type="button" data-section="contact" aria-haspopup="menu" aria-expanded="false" aria-controls="headerMenu">Contact</button>
    </nav>
    <div class="header-menu" id="headerMenu" role="menu" hidden>
      <a class="header-choice header-choice--home" role="menuitem" data-page="residential.html" href="residential.html#services">Home &amp; Family</a>
      <a class="header-choice header-choice--business" role="menuitem" data-page="business.html" href="business.html#services">Business &amp; Office</a>
    </div>
  </header>

  <main class="chooser" id="chooser">

    <!-- Residential preview panel -->
    <div class="half half--residential"
         role="link" tabindex="0"
         aria-label="Residential IT Support — Home and Family"
         data-href="residential.html">
      <iframe class="half-preview"
              src="residential.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Residential site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="caption-wrapper caption-wrapper--residential">
        <div class="half-caption caption-inner">
          <!-- House icon -->
          <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 30L32 8L58 30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 25V56H26V42C26 40.895 26.895 40 28 40H36C37.105 40 38 40.895 38 42V56H52V25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="18" y="32" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.18"/>
            <rect x="37" y="32" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.18"/>
          </svg>
          <span class="half-name">Home &amp; Family</span>
          <span class="half-sub">Residential IT Support</span>
          <span class="half-arrow">Enter &rsaquo;</span>
        </div>
      </div>
    </div>

    <!-- Business preview panel -->
    <div class="half half--business"
         role="link" tabindex="0"
         aria-label="Business IT Services — Business and Office"
         data-href="business.html">
      <iframe class="half-preview"
              src="business.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Business site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="caption-wrapper caption-wrapper--business">
        <div class="half-caption caption-inner">
          <!-- Office building icon -->
          <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="8" y="10" width="48" height="46" rx="2" stroke="currentColor" stroke-width="2.5"/>
            <line x1="8" y1="26" x2="56" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="40" x2="56" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="14" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="28" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="42" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="14" y="30" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
            <rect x="42" y="30" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
            <path d="M26 56V46H38V56" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="half-name">Business &amp; Office</span>
          <span class="half-sub">Commercial IT Services</span>
          <span class="half-arrow">Enter &rsaquo;</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    var REF_W = 1440;
    var header = document.querySelector('.header');
    var headerMenu = document.getElementById('headerMenu');
    var headerLinks = document.querySelectorAll('.header-link[data-section]');
    var headerChoices = document.querySelectorAll('.header-choice[data-page]');

    function closeHeaderMenu() {
      if (!header || !headerMenu) return;
      header.classList.remove('is-menu-open');
      headerMenu.hidden = true;
      headerLinks.forEach(function(link) {
        link.classList.remove('is-active');
        link.setAttribute('aria-expanded', 'false');
      });
    }

    function openHeaderMenu(section, trigger) {
      if (!header || !headerMenu) return;
      var isSameOpen = header.classList.contains('is-menu-open') && headerMenu.dataset.section === section;
      if (isSameOpen) {
        closeHeaderMenu();
        return;
      }

      headerMenu.dataset.section = section;
      headerChoices.forEach(function(choice) {
        choice.href = choice.dataset.page + '#' + section;
      });
      headerLinks.forEach(function(link) {
        var isActive = link === trigger;
        link.classList.toggle('is-active', isActive);
        link.setAttribute('aria-expanded', isActive ? 'true' : 'false');
      });
      headerMenu.hidden = false;
      requestAnimationFrame(function() {
        header.classList.add('is-menu-open');
      });
    }

    headerLinks.forEach(function(link) {
      link.addEventListener('click', function(event) {
        event.stopPropagation();
        openHeaderMenu(link.dataset.section, link);
      });
    });

    if (header) {
      header.addEventListener('click', function(event) {
        event.stopPropagation();
      });
    }

    document.addEventListener('click', closeHeaderMenu);
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape') closeHeaderMenu();
    });

    function scalePreview(half) {
      var iframe = half.querySelector('.half-preview');
      if (!iframe) return;
      var W     = half.offsetWidth;
      var H     = half.offsetHeight;
      var scale = W / REF_W;
      iframe.style.width     = REF_W + 'px';
      iframe.style.height    = Math.ceil(H / scale) + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    }

    function injectFlash(color) {
      var el = document.createElement('div');
      el.setAttribute('aria-hidden', 'true');
      el.style.cssText = [
        'position:fixed',
        'inset:0',
        'z-index:200',
        'pointer-events:none',
        'background:' + color,
        'animation:flash-out 0.35s ease-out forwards'
      ].join(';');
      document.body.appendChild(el);
      el.addEventListener('animationend', function() { el.parentNode && el.parentNode.removeChild(el); });
    }

    function selectHalf(half) {
      var chooser = document.getElementById('chooser');
      if (chooser.classList.contains('has-selection')) return;

      var dest      = half.dataset.href;
      var isRes     = half.classList.contains('half--residential');
      var flashColor = isRes
        ? 'rgba(212,114,42,0.22)'
        : 'rgba(91,94,204,0.22)';

      // 1. Inject full-screen flash for immediate "confirmed" feedback
      injectFlash(flashColor);

      // 2. Hide the other panel
      chooser.classList.add('has-selection');

      // 3. Snapshot card position before any layout change
      var cardRect = half.getBoundingClientRect();

      // 4. Expand to fixed fullscreen
      half.classList.add('is-selecting');
      var fullRect = half.getBoundingClientRect();

      // 5. FLIP: compute the inverse transform (visually starts at card position)
      var sx = cardRect.width  / fullRect.width;
      var sy = cardRect.height / fullRect.height;
      var tx = cardRect.left   - fullRect.left;
      var ty = cardRect.top    - fullRect.top;

      // Apply the starting (inverted) state — keep rounded corners at start
      half.style.borderRadius = '0px';
      half.style.transition   = 'none';
      half.style.transform    = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')';

      // Force reflow so browser registers starting state
      void half.offsetHeight;

      // Re-scale the iframe for the now-fullscreen panel
      scalePreview(half);

      // 6. Animate to fullscreen — expo-out easing for game-like explosive feel
      half.style.transition = 'transform 0.36s cubic-bezier(0.19,1,0.22,1)';
      half.style.transform  = 'translate(0,0) scale(1,1)';

      // 7. Fly the header bubble to the top-left nav position
      var divider = header.querySelector('.header-divider');
      var tagline = header.querySelector('.header-tagline');
      var nav     = header.querySelector('.header-nav');
      closeHeaderMenu();

      header.style.transition = [
        'left 0.52s cubic-bezier(0.25,0.46,0.45,0.94)',
        'top 0.44s cubic-bezier(0.25,0.46,0.45,0.94)',
        'transform 0.52s cubic-bezier(0.25,0.46,0.45,0.94)'
      ].join(',');
      header.style.left      = '32px';
      header.style.top       = '16px';
      header.style.transform = 'none';

      // Tagline + divider fade out early in the flight
      setTimeout(function() {
        divider.style.transition = 'opacity 0.18s ease';
        tagline.style.transition = 'opacity 0.18s ease';
        nav.style.transition     = 'opacity 0.18s ease';
        divider.style.opacity    = '0';
        tagline.style.opacity    = '0';
        nav.style.opacity        = '0';
      }, 130);

      // Flag destination page to play receiving animation
      sessionStorage.setItem('fromLanding', '1');

      // Navigate once bubble flight completes
      setTimeout(function() {
        window.location.href = dest;
      }, 600);
    }

    function resetState() {
      // Clear all selection state — needed when browser restores page from bfcache
      var chooser = document.getElementById('chooser');
      chooser.classList.remove('has-selection');
      document.querySelectorAll('.half').forEach(function(half) {
        half.classList.remove('is-selecting');
        half.removeAttribute('style');
      });
      document.querySelectorAll('.half').forEach(scalePreview);

      // Reset header bubble back to centered position (no transition — snap immediately)
      var header = document.querySelector('.header');
      header.style.transition = 'none';
      header.style.left       = '50%';
      header.style.top        = '18px';
      header.style.transform  = 'translateX(-50%)';
      var divider = header.querySelector('.header-divider');
      var tagline = header.querySelector('.header-tagline');
      divider.style.transition = 'none';
      tagline.style.transition = 'none';
      divider.style.opacity    = '';
      tagline.style.opacity    = '';
    }

    function init() {
      var halves = document.querySelectorAll('.half');

      halves.forEach(function(half) {
        scalePreview(half);

        half.addEventListener('click', function() { selectHalf(this); });
        half.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectHalf(this);
          }
        });
      });

      window.addEventListener('resize', function() {
        halves.forEach(scalePreview);
      });

      // When the back button restores this page from bfcache, reset the
      // selection animation so the chooser is clean and interactive again
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) resetState();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
