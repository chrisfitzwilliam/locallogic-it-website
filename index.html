<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Manrope", sans-serif;
      background: #07070f;
    }

    /* ── Flash animation (injected on click) ── */
    @keyframes flash-out {
      0%   { opacity: 0.8; }
      100% { opacity: 0;   }
    }

    /* ── Header — frosted glass pill ── */
    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 22px;
      background: rgba(8,8,18,0.90);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      white-space: nowrap;
      pointer-events: none;
    }
    .header-logo img { height: 32px; width: auto; display: block; }
    .header-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .header-divider {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    .header-tagline {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    /* ── Chooser — full-bleed, no gap ── */
    @keyframes chooser-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .chooser {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      animation: chooser-fade-in 0.6s ease both;
    }

    /* ── Halves — full-bleed ── */
    .half {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      outline: none;
    }
    /* Thin line between the two halves */
    .half--residential {
      box-shadow: inset -1px 0 0 rgba(255,255,255,0.08);
    }
    .half:focus-visible {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
    }

    /* ── Iframe preview ── */
    .half-preview {
      position: absolute;
      top: 0; left: 0;
      border: none;
      display: block;
      pointer-events: none;
      transform-origin: 0 0;
    }

    /* ── Dim overlay — very opaque + heavy blur (frosted glass over preview) ── */
    .half-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: rgba(4,6,14,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        opacity          0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        backdrop-filter  0.4s ease,
        -webkit-backdrop-filter 0.4s ease;
    }

    /* Hover: frost clears — preview revealed sharp and bright ── */
    .half:hover .half-overlay {
      opacity: 0.06;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }

    /* ── Centered caption — glass card ── */
    .half-caption {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      text-align: center;
      padding: 28px 44px;
      background: rgba(0,0,0,0.28);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      white-space: nowrap;
      transition:
        transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity   0.38s ease;
    }
    .half--residential .half-caption { border: 1px solid rgba(201,169,110,0.3); }
    .half--business    .half-caption { border: 1px solid rgba(59,130,246,0.3);  }

    .half:hover .half-caption {
      /* subtle rise on hover */
      transform: translate(-50%, -56%);
    }

    .half-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: block;
      margin-bottom: 4px;
    }
    .half--residential .half-name { color: #C9A96E; }
    .half--business    .half-name { color: #3B82F6; }

    .half-sub {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
      display: block;
    }

    /* Hint arrow — appears on hover ── */
    .half-arrow {
      display: block;
      margin-top: 14px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(6px);
      transition:
        opacity   0.3s ease,
        transform 0.3s ease;
    }
    .half--residential .half-arrow { color: rgba(201,169,110,0.8); }
    .half--business    .half-arrow { color: rgba(59,130,246,0.8);  }
    .half:hover .half-arrow {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Selection state — FLIP base ── */
    .half.is-selecting {
      position: fixed !important;
      inset: 0 !important;
      z-index: 100;
      flex: none;
      overflow: hidden;
    }
    .half.is-selecting .half-overlay  { opacity: 0 !important; transition: opacity 0.12s ease !important; }
    .half.is-selecting .half-caption  { opacity: 0 !important; transition: opacity 0.08s ease !important; }

    /* Fade out the non-selected half */
    .chooser.has-selection .half:not(.is-selecting) {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      html, body { overflow: auto; }
      .chooser { flex-direction: column; height: auto; min-height: 100vh; }
      .half { min-height: 44vh; }
      .half--residential { box-shadow: inset 0 -1px 0 rgba(255,255,255,0.08); }
    }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .chooser, .half-overlay, .half-caption, .half-arrow { animation: none; transition: none; }
    }
  </style>
</head>
<body>

  <!-- Frosted glass pill header -->
  <header class="header">
    <div class="header-logo">
      <img src="assets/logo.png" alt="Local Logic IT logo" />
    </div>
    <span class="header-name">Local Logic IT</span>
    <div class="header-divider" aria-hidden="true"></div>
    <span class="header-tagline">Local Service. Logical Solutions.</span>
  </header>

  <main class="chooser" id="chooser">

    <!-- Residential preview panel -->
    <div class="half half--residential"
         role="link" tabindex="0"
         aria-label="Residential IT Support — Home and Family"
         data-href="residential.html">
      <iframe class="half-preview"
              src="residential.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Residential site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="half-caption">
        <span class="half-name">Home &amp; Family</span>
        <span class="half-sub">Residential IT Support</span>
        <span class="half-arrow">Enter &rsaquo;</span>
      </div>
    </div>

    <!-- Business preview panel -->
    <div class="half half--business"
         role="link" tabindex="0"
         aria-label="Business IT Services — Business and Office"
         data-href="business.html">
      <iframe class="half-preview"
              src="business.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Business site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="half-caption">
        <span class="half-name">Business &amp; Office</span>
        <span class="half-sub">Commercial IT Services</span>
        <span class="half-arrow">Enter &rsaquo;</span>
      </div>
    </div>

  </main>

  <script>
    var REF_W = 1440;

    function scalePreview(half) {
      var iframe = half.querySelector('.half-preview');
      if (!iframe) return;
      var W     = half.offsetWidth;
      var H     = half.offsetHeight;
      var scale = W / REF_W;
      iframe.style.width     = REF_W + 'px';
      iframe.style.height    = Math.ceil(H / scale) + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    }

    function injectFlash(color) {
      var el = document.createElement('div');
      el.setAttribute('aria-hidden', 'true');
      el.style.cssText = [
        'position:fixed',
        'inset:0',
        'z-index:200',
        'pointer-events:none',
        'background:' + color,
        'animation:flash-out 0.35s ease-out forwards'
      ].join(';');
      document.body.appendChild(el);
      el.addEventListener('animationend', function() { el.parentNode && el.parentNode.removeChild(el); });
    }

    function selectHalf(half) {
      var chooser = document.getElementById('chooser');
      if (chooser.classList.contains('has-selection')) return;

      var dest      = half.dataset.href;
      var isRes     = half.classList.contains('half--residential');
      var flashColor = isRes
        ? 'rgba(201,169,110,0.22)'
        : 'rgba(59,130,246,0.22)';

      // 1. Inject full-screen flash for immediate "confirmed" feedback
      injectFlash(flashColor);

      // 2. Hide the other panel
      chooser.classList.add('has-selection');

      // 3. Snapshot card position before any layout change
      var cardRect = half.getBoundingClientRect();

      // 4. Expand to fixed fullscreen
      half.classList.add('is-selecting');
      var fullRect = half.getBoundingClientRect();

      // 5. FLIP: compute the inverse transform (visually starts at card position)
      var sx = cardRect.width  / fullRect.width;
      var sy = cardRect.height / fullRect.height;
      var tx = cardRect.left   - fullRect.left;
      var ty = cardRect.top    - fullRect.top;

      // Apply the starting (inverted) state — keep rounded corners at start
      half.style.borderRadius = '0px';
      half.style.transition   = 'none';
      half.style.transform    = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')';

      // Force reflow so browser registers starting state
      void half.offsetHeight;

      // Re-scale the iframe for the now-fullscreen panel
      scalePreview(half);

      // 6. Animate to fullscreen — expo-out easing for game-like explosive feel
      half.style.transition = 'transform 0.36s cubic-bezier(0.19,1,0.22,1)';
      half.style.transform  = 'translate(0,0) scale(1,1)';

      // Navigate once animation is complete
      setTimeout(function() {
        window.location.href = dest;
      }, 310);
    }

    function resetState() {
      // Clear all selection state — needed when browser restores page from bfcache
      var chooser = document.getElementById('chooser');
      chooser.classList.remove('has-selection');
      document.querySelectorAll('.half').forEach(function(half) {
        half.classList.remove('is-selecting');
        half.removeAttribute('style');
      });
      document.querySelectorAll('.half').forEach(scalePreview);
    }

    function init() {
      var halves = document.querySelectorAll('.half');

      halves.forEach(function(half) {
        scalePreview(half);

        half.addEventListener('click', function() { selectHalf(this); });
        half.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectHalf(this);
          }
        });
      });

      window.addEventListener('resize', function() {
        halves.forEach(scalePreview);
      });

      // When the back button restores this page from bfcache, reset the
      // selection animation so the chooser is clean and interactive again
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) resetState();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
