<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <meta name="view-transition" content="same-origin" />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --quartz-bg: rgba(255, 255, 255, 0.03);
      --quartz-border: rgba(255, 255, 255, 0.12);
      --quartz-edge: rgba(255, 255, 255, 0.4);
      --accent-glow: rgba(200, 220, 255, 0.15);
      --text-primary: #ffffff;
      --text-secondary: rgba(255, 255, 255, 0.5);
      --transition-fluid: cubic-bezier(0.23, 1, 0.32, 1);
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; overflow-y: scroll; font-size: 15px; }
    body { height: 100%; overflow: hidden; }
    body {
      font-family: "Manrope", sans-serif;
      background: #07070f;
    }

    /* ── Flash animation (injected on click) ── */
    @keyframes flash-out {
      0%   { opacity: 0.8; }
      100% { opacity: 0;   }
    }

    /* The Quartz Shell */
    .pill-wrapper {
      position: fixed;
      top: 18px;
      left: 50%;
      z-index: 300;
      will-change: left, top, transform, max-width;
      padding: 4px;
      border-radius: 100px;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
      box-shadow: 
          0 20px 40px rgba(0,0,0,0.4),
          inset 0 0 0 1px var(--quartz-border);
      animation: quartz-entry 1.2s var(--transition-fluid) forwards;
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
      font-family: 'Inter', sans-serif;
      transition: all 0.8s var(--transition-fluid);
    }

    .pill-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      background: rgba(10, 10, 15, 0.4);
      backdrop-filter: blur(32px) saturate(150%);
      -webkit-backdrop-filter: blur(32px) saturate(150%);
      border-radius: 100px;
      border: 1px solid var(--quartz-edge);
      position: relative;
      z-index: 1;
      overflow: visible; /* Changed from hidden to allow dropdown */
      transition: all 0.8s var(--transition-fluid);
    }

    .pill-nav::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 100px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='noiseFilter'%3e%3cfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3e%3c/svg%3e");
      opacity: 0.04;
      pointer-events: none;
      mix-blend-mode: overlay;
      z-index: -1;
    }

    .header-logo, .header-name {
      position: relative;
      z-index: 2;
    }

    .header-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .header-logo svg { height: 24px; width: 24px; display: block; }

    .header-name {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    /* Cinematic Expansion Segment */
    .header-nav-container {
      display: flex;
      align-items: center;
      max-width: 0;
      opacity: 0;
      overflow: hidden;
      transition: max-width 0.8s var(--transition-fluid), opacity 0.6s ease;
    }

    .pill-wrapper.is-expanded .header-nav-container {
      max-width: 600px;
      opacity: 1;
    }

    .header-links {
      display: flex;
      gap: 18px;
      padding: 0 10px;
      list-style: none;
      align-items: center;
    }

    .header-links a, .dropdown-trigger {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.3s ease, transform 0.3s ease, opacity 0.5s var(--transition-fluid);
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-10px);
      cursor: pointer;
    }

    .header-links a:hover, .dropdown-trigger:hover {
      color: #fff;
      transform: translateY(-1px);
    }

    .pill-wrapper.is-expanded .header-links a,
    .pill-wrapper.is-expanded .dropdown-trigger {
      opacity: 1;
      transform: translateX(0);
    }

    .pill-wrapper.is-expanded .header-links a:nth-child(1),
    .pill-wrapper.is-expanded .dropdown-trigger { transition-delay: 0.4s; }
    .pill-wrapper.is-expanded .header-links a:nth-child(2) { transition-delay: 0.5s; }
    .pill-wrapper.is-expanded .header-links a:nth-child(3) { transition-delay: 0.6s; }
    .pill-wrapper.is-expanded .header-links a:nth-child(4) { transition-delay: 0.7s; }

    /* Dropdown Logic */
    .dropdown { position: relative; }
    .dropdown-content {
      display: none;
      position: absolute;
      top: calc(100% + 15px);
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(10, 10, 15, 0.9);
      backdrop-filter: blur(24px);
      border: 1px solid var(--quartz-border);
      border-radius: 16px;
      min-width: 180px;
      padding: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s var(--transition-fluid), transform 0.3s var(--transition-fluid);
      pointer-events: none;
    }

    .dropdown:hover .dropdown-content,
    .dropdown.is-open .dropdown-content {
      display: block;
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .dropdown-content a {
      opacity: 1 !important;
      transform: none !important;
      padding: 12px 16px;
      display: block;
      color: var(--text-secondary) !important;
      font-size: 0.85rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .dropdown-content a:hover {
      background: rgba(255,255,255,0.08);
      color: #fff !important;
    }

    /* Tagline Pill */
    .tagline-pill {
      position: fixed;
      top: 82px;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      padding: 6px 20px;
      border-radius: 999px;
      border: 1px solid var(--quartz-border);
      color: var(--text-secondary);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      z-index: 299;
      opacity: 0;
      transition: all 1s var(--transition-fluid);
      white-space: nowrap;
    }

    .pill-wrapper.is-expanded + .tagline-pill {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Quick Support Button */
    .btn-support {
      background: var(--primary);
      color: #fff !important;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem !important;
      box-shadow: 0 4px 12px rgba(74,128,232,0.3);
    }
    .btn-support:hover {
      background: var(--primary-2);
      box-shadow: 0 6px 16px rgba(74,128,232,0.4);
    }

    .pill-divider {
      width: 1px;
      height: 20px;
      background: var(--quartz-border);
      margin: 0 4px;
      position: relative;
      z-index: 2;
    }

    @keyframes quartz-entry {
      to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
      }
    }

    /* Chooser Layout */
    @keyframes chooser-fade-in { from { opacity: 0; } to { opacity: 1; } }
    .chooser { display: flex; width: 100%; height: 100vh; overflow: hidden; animation: chooser-fade-in 0.6s ease both; }
    .half { position: relative; flex: 1; overflow: hidden; cursor: pointer; outline: none; }
    .half--residential { box-shadow: inset -1px 0 0 rgba(255,255,255,0.08); }
    .half-preview { position: absolute; top: 0; left: 0; border: none; display: block; pointer-events: none; transform-origin: 0 0; }
    .half-overlay { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: rgba(4,6,14,0.85); backdrop-filter: blur(14px); transition: all 0.4s var(--transition-fluid); }
    .half:hover .half-overlay { opacity: 0.7; backdrop-filter: blur(10px); }

    @keyframes glow-gold {
      0%, 100% { box-shadow: 0 0 22px rgba(245,158,11,0.18), 0 8px 48px rgba(245,158,11,0.10), inset 0 1px 0 rgba(255,255,255,0.09); }
      50% { box-shadow: 0 0 38px rgba(245,158,11,0.34), 0 8px 64px rgba(245,158,11,0.20), inset 0 1px 0 rgba(255,255,255,0.13); }
    }
    @keyframes glow-blue {
      0%, 100% { box-shadow: 0 0 22px rgba(74,128,232,0.18), 0 8px 48px rgba(74,128,232,0.10), inset 0 1px 0 rgba(255,255,255,0.09); }
      50% { box-shadow: 0 0 38px rgba(74,128,232,0.34), 0 8px 64px rgba(74,128,232,0.20), inset 0 1px 0 rgba(255,255,255,0.13); }
    }

    .half-caption {
      position: absolute;
      top: calc(50% + 40px);
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      text-align: center;
      padding: 36px 52px 32px;
      background: rgba(6,7,16,0.55);
      border-radius: 18px;
      backdrop-filter: blur(16px);
      pointer-events: none;
      white-space: nowrap;
      border-top: 1px solid rgba(255,255,255,0.18);
      transition: all 0.38s var(--transition-fluid);
    }
    .half--residential .half-caption { border-color: rgba(245,158,11,0.32); animation: glow-gold 3.6s ease-in-out infinite; }
    .half--business .half-caption { border-color: rgba(74,128,232,0.32); animation: glow-blue 3.6s ease-in-out infinite; }
    .half:hover .half-caption { transform: translate(-50%, -56%); }

    .half-icon { display: block; width: 52px; height: 52px; margin: 0 auto 18px; }
    .half--residential .half-icon { color: #F59E0B; }
    .half--business .half-icon { color: #4A80E8; }
    .half-name { font-size: 1.5rem; font-weight: 800; display: block; margin-bottom: 5px; }
    .half--residential .half-name { color: #F59E0B; }
    .half--business .half-name { color: #4A80E8; }
    .half-sub { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); display: block; }
    .half-arrow { display: block; margin-top: 18px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
    .half--residential .half-arrow { color: rgba(245,158,11,0.85); }
    .half--business .half-arrow { color: rgba(74,128,232,0.85); }

    .half.is-selecting { position: fixed !important; inset: 0 !important; z-index: 100; flex: none; overflow: hidden; }
    .half.is-selecting .half-overlay { opacity: 0 !important; }
    .half.is-selecting .half-caption { opacity: 0 !important; }
    .chooser.has-selection .half:not(.is-selecting) { opacity: 0; pointer-events: none; transition: opacity 0.18s ease; }

    @media (max-width: 767px) {
      .chooser { flex-direction: column; height: auto; min-height: 100vh; }
      .half { min-height: 44vh; }
      .tagline-pill { top: auto; bottom: 20px; font-size: 0.6rem; }
    }
  </style>
</head>
<body>

  <!-- The Header Layout -->
  <div class="pill-wrapper" id="quartz-shell">
      <div class="glint" id="refractor"></div>
      <header class="pill-nav">
          <div class="header-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <span class="header-name">Local Logic IT</span>
          
          <div class="header-nav-container" id="expanded-nav">
            <div class="pill-divider" aria-hidden="true"></div>
            <nav class="header-links">
                <div class="dropdown" id="services-dropdown">
                  <span class="dropdown-trigger">Services <i class="ph ph-caret-down"></i></span>
                  <div class="dropdown-content">
                    <a href="residential.html">Home &amp; Family</a>
                    <a href="business.html">Business &amp; Office</a>
                  </div>
                </div>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
                <a href="quick-support.html" class="btn-support">Quick Support</a>
            </nav>
          </div>
      </header>
  </div>
  <div class="tagline-pill">Local Service. Logical Solutions.</div>

  <main class="chooser" id="chooser">
    <div class="half half--residential" role="link" tabindex="0" aria-label="Residential IT Support" data-href="residential.html">
      <iframe class="half-preview" src="residential.html" loading="lazy" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
      <div class="half-overlay"></div>
      <div class="half-caption">
        <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M6 30L32 8L58 30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 25V56H26V42C26 40.895 26.895 40 28 40H36C37.105 40 38 40.895 38 42V56H52V25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="half-name">Home &amp; Family</span>
        <span class="half-sub">Residential IT Support</span>
        <span class="half-arrow">Enter &rsaquo;</span>
      </div>
    </div>

    <div class="half half--business" role="link" tabindex="0" aria-label="Business IT Services" data-href="business.html">
      <iframe class="half-preview" src="business.html" loading="lazy" scrolling="no" tabindex="-1" aria-hidden="true"></iframe>
      <div class="half-overlay"></div>
      <div class="half-caption">
        <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="8" y="10" width="48" height="46" rx="2" stroke="currentColor" stroke-width="2.5"/>
          <path d="M26 56V46H38V56" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="half-name">Business &amp; Office</span>
        <span class="half-sub">Commercial IT Services</span>
        <span class="half-arrow">Enter &rsaquo;</span>
      </div>
    </div>
  </main>

  <script>
    function scalePreview(half) {
      var iframe = half.querySelector('.half-preview');
      if (!iframe) return;
      var REF_W = document.documentElement.clientWidth;
      var W = half.offsetWidth;
      var H = half.offsetHeight;
      var scale = W / REF_W;
      if (REF_W <= 767) { scale = 1; REF_W = W; }
      iframe.style.width = REF_W + 'px';
      iframe.style.height = Math.ceil(H / scale) + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    }

    function injectFlash(color) {
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;inset:0;z-index:200;pointer-events:none;background:' + color + ';animation:flash-out 0.35s ease-out forwards';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function selectHalf(half) {
      var chooser = document.getElementById('chooser');
      if (chooser.classList.contains('has-selection')) return;
      var dest = half.dataset.href;
      var isRes = half.classList.contains('half--residential');
      injectFlash(isRes ? 'rgba(245,158,11,0.22)' : 'rgba(74,128,232,0.22)');
      chooser.classList.add('has-selection');
      var cardRect = half.getBoundingClientRect();
      half.classList.add('is-selecting');
      var fullRect = half.getBoundingClientRect();
      var sx = cardRect.width / fullRect.width, sy = cardRect.height / fullRect.height;
      var tx = cardRect.left - fullRect.left, ty = cardRect.top - fullRect.top;
      half.style.borderRadius = '0px';
      half.style.transition = 'none';
      half.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')';
      void half.offsetHeight;
      scalePreview(half);
      half.style.transition = 'transform 0.36s cubic-bezier(0.19,1,0.22,1)';
      half.style.transform = 'translate(0,0) scale(1,1)';
      var header = document.getElementById('quartz-shell');
      if (header) {
        header.style.opacity = '1'; header.style.transform = 'translateX(-50%) translateY(0)'; header.style.animation = 'none';
        void header.offsetWidth;
        header.style.transition = 'all 1s var(--transition-fluid)';
        header.style.left = '32px'; header.style.top = '7px'; header.style.transform = 'translateX(0) translateY(0)';
      }
      sessionStorage.setItem('fromLanding', '1');
      setTimeout(() => window.location.href = dest, 1000);
    }

    function init() {
      var halves = document.querySelectorAll('.half');
      halves.forEach(h => {
        scalePreview(h);
        h.addEventListener('click', function() { selectHalf(this); });
        h.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') selectHalf(this); });
      });
      window.addEventListener('resize', () => halves.forEach(scalePreview));

      const shell = document.getElementById('quartz-shell');
      const glint = document.getElementById('refractor');
      if (shell && glint) {
        shell.addEventListener('mousemove', e => {
          const rect = shell.getBoundingClientRect();
          glint.style.transform = `translateX(${e.clientX - rect.left - 50}px)`;
        });
        setTimeout(() => shell.classList.add('is-expanded'), 1800);
      }

      // Dropdown Toggle for Mobile
      const dropdown = document.getElementById('services-dropdown');
      if (dropdown) {
        dropdown.addEventListener('click', (e) => {
          if (window.innerWidth <= 767) {
            e.stopPropagation();
            dropdown.classList.toggle('is-open');
          }
        });
      }
      document.addEventListener('click', () => dropdown.classList.remove('is-open'));
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
    else init();
  </script>

</body>
</html>
