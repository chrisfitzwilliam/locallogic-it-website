<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Manrope", sans-serif;
      background: linear-gradient(90deg, #F0F0F4 0%, #F0F0F4 50%, #F4F0EC 50%, #F4F0EC 100%);
    }

    /* ── Flash animation (injected on click) ── */
    @keyframes flash-out {
      0%   { opacity: 0.8; }
      100% { opacity: 0;   }
    }

    /* ── Header — frosted glass pill ── */
    .header {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      will-change: left, top, transform;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 22px;
      background: rgba(8,8,18,0.90);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 50px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      white-space: nowrap;
      pointer-events: none;
    }
    .header-logo img { height: 32px; width: auto; display: block; }
    .header-name {
      font-size: 1.05rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .header-divider {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }
    .header-tagline {
      font-size: 0.72rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    /* ── Chooser — full-bleed, no gap ── */
    @keyframes chooser-fade-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .chooser {
      display: flex;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      animation: chooser-fade-in 0.6s ease both;
    }

    /* ── Halves — full-bleed ── */
    .half {
      position: relative;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      outline: none;
    }
    /* Thin line between the two halves */
    .half--residential {
      box-shadow: inset -1px 0 0 rgba(255,255,255,0.08);
    }
    .half:focus-visible {
      box-shadow: inset 0 0 0 3px rgba(255,255,255,0.5);
    }

    /* ── Iframe preview ── */
    .half-preview {
      position: absolute;
      top: 0; left: 0;
      border: none;
      display: block;
      pointer-events: none;
      transform-origin: 0 0;
    }

    /* ── Dim overlay — very opaque + heavy blur (frosted glass over preview) ── */
    .half-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: rgba(4,6,14,0.85);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition:
        opacity          0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        backdrop-filter  0.4s ease,
        -webkit-backdrop-filter 0.4s ease;
    }

    /* Hover: very slight frost lift — background stays mostly covered */
    .half:hover .half-overlay {
      opacity: 0.75;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    /* ── Breathing glow animations for captions ── */
    @keyframes glow-gold {
      0%, 100% {
        box-shadow:
          0 0 22px rgba(212,114,42,0.18),
          0 8px 48px rgba(212,114,42,0.10),
          inset 0 1px 0 rgba(255,255,255,0.09);
      }
      50% {
        box-shadow:
          0 0 38px rgba(212,114,42,0.34),
          0 8px 64px rgba(212,114,42,0.20),
          inset 0 1px 0 rgba(255,255,255,0.13);
      }
    }
    @keyframes glow-blue {
      0%, 100% {
        box-shadow:
          0 0 22px rgba(91,94,204,0.18),
          0 8px 48px rgba(91,94,204,0.10),
          inset 0 1px 0 rgba(255,255,255,0.09);
      }
      50% {
        box-shadow:
          0 0 38px rgba(91,94,204,0.34),
          0 8px 64px rgba(91,94,204,0.20),
          inset 0 1px 0 rgba(255,255,255,0.13);
      }
    }

    /* ── Centered caption — premium glass card ── */
    .caption-wrapper {
      position: absolute;
      top: calc(50% + 26px);
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 3;
      border-radius: 18px;
      padding: 1.5px;
      overflow: hidden;
      pointer-events: none;
      white-space: nowrap;
      transition:
        transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        opacity   0.38s ease;
    }
    .caption-wrapper::before {
      content: '';
      position: absolute;
      inset: -55%;
      opacity: 0.92;
      transform-origin: center;
      animation: border-sweep 5.2s cubic-bezier(0.45, 0, 0.25, 1) infinite;
      transition: opacity 0.3s ease, filter 0.3s ease;
    }
    .caption-wrapper--residential::before {
      background: conic-gradient(from -45deg, transparent 0deg, transparent 205deg, rgba(212,114,42,0.2) 232deg, #D4722A 256deg, #F2B07D 276deg, #D4722A 296deg, rgba(212,114,42,0.2) 320deg, transparent 348deg);
    }
    .caption-wrapper--business::before {
      background: conic-gradient(from -45deg, transparent 0deg, transparent 205deg, rgba(91,94,204,0.2) 232deg, #5B5ECC 256deg, #9898FF 276deg, #5B5ECC 296deg, rgba(91,94,204,0.2) 320deg, transparent 348deg);
    }
    .half:hover .caption-wrapper::before {
      opacity: 1;
      filter: saturate(1.18) brightness(1.08);
      animation-duration: 3.4s;
    }
    @keyframes border-sweep {
      0%, 12%   { transform: rotate(-28deg); }
      44%, 56%  { transform: rotate(142deg); }
      88%, 100% { transform: rotate(332deg); }
    }
    .half-caption {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 36px 52px 32px;
      background: rgba(6,7,16,0.55);
      border-radius: 16.5px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      pointer-events: none;
      white-space: nowrap;
      border-top: 1px solid rgba(255,255,255,0.18);
      border-left: 1px solid rgba(255,255,255,0.07);
      border-right: 1px solid rgba(255,255,255,0.07);
      border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: opacity 0.38s ease;
    }
    /* Brand-coloured glow + border accent */
    .half--residential .half-caption {
      border-color: rgba(212,114,42,0.32) rgba(212,114,42,0.14) rgba(212,114,42,0.08) rgba(212,114,42,0.14);
      animation: glow-gold 3.6s ease-in-out infinite;
    }
    .half--business .half-caption {
      border-color: rgba(91,94,204,0.32) rgba(91,94,204,0.14) rgba(91,94,204,0.08) rgba(91,94,204,0.14);
      animation: glow-blue 3.6s ease-in-out infinite;
    }

    .half:hover .caption-wrapper {
      transform: translate(-50%, -56%);
    }

    /* SVG icon above the label */
    .half-icon {
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px;
    }
    .half--residential .half-icon { color: #E8A870; }
    .half--business    .half-icon { color: #8B8FE8; }

    .half-name {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: block;
      margin-bottom: 5px;
    }
    .half--residential .half-name { color: #E8A870; }
    .half--business    .half-name { color: #8B8FE8; }

    .half-sub {
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      display: block;
    }

    /* Hint arrow — fades in on hover ── */
    .half-arrow {
      display: block;
      margin-top: 18px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(5px);
      transition:
        opacity   0.3s ease,
        transform 0.3s ease;
    }
    .half--residential .half-arrow { color: rgba(212,114,42,0.85); }
    .half--business    .half-arrow { color: rgba(91,94,204,0.85);  }
    .half:hover .half-arrow {
      opacity: 1;
      transform: translateY(0);
    }

    /* ── Selection state — FLIP base ── */
    .half.is-selecting {
      position: fixed !important;
      inset: 0 !important;
      z-index: 100;
      flex: none;
      overflow: hidden;
    }
    .half.is-selecting .half-overlay  { opacity: 0 !important; transition: opacity 0.12s ease !important; }
    .half.is-selecting .caption-wrapper,
    .half.is-selecting .half-caption  { opacity: 0 !important; transition: opacity 0.08s ease !important; }

    /* Fade out the non-selected half */
    .chooser.has-selection .half:not(.is-selecting) {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    /* ── Responsive ── */
    @media (max-width: 767px) {
      html, body { overflow: auto; }
      .chooser { flex-direction: column; height: auto; min-height: 100vh; }
      .half { min-height: 44vh; }
      .half--residential { box-shadow: inset 0 -1px 0 rgba(255,255,255,0.08); }
    }

    /* Respect reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .chooser, .half-overlay, .caption-wrapper::before, .half-caption, .half-arrow { animation: none; transition: none; }
    }
  </style>
</head>
<body>

  <!-- Frosted glass pill header -->
  <header class="header">
    <div class="header-logo">
      <img src="assets/logo.png" alt="Local Logic IT logo" />
    </div>
    <span class="header-name">Local Logic IT</span>
    <div class="header-divider" aria-hidden="true"></div>
    <span class="header-tagline">Local Service. Logical Solutions.</span>
  </header>

  <main class="chooser" id="chooser">

    <!-- Residential preview panel -->
    <div class="half half--residential"
         role="link" tabindex="0"
         aria-label="Residential IT Support — Home and Family"
         data-href="residential.html">
      <iframe class="half-preview"
              src="residential.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Residential site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="caption-wrapper caption-wrapper--residential">
        <div class="half-caption caption-inner">
          <!-- House icon -->
          <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 30L32 8L58 30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 25V56H26V42C26 40.895 26.895 40 28 40H36C37.105 40 38 40.895 38 42V56H52V25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="18" y="32" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.18"/>
            <rect x="37" y="32" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.18"/>
          </svg>
          <span class="half-name">Home &amp; Family</span>
          <span class="half-sub">Residential IT Support</span>
          <span class="half-arrow">Enter &rsaquo;</span>
        </div>
      </div>
    </div>

    <!-- Business preview panel -->
    <div class="half half--business"
         role="link" tabindex="0"
         aria-label="Business IT Services — Business and Office"
         data-href="business.html">
      <iframe class="half-preview"
              src="business.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Business site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="caption-wrapper caption-wrapper--business">
        <div class="half-caption caption-inner">
          <!-- Office building icon -->
          <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="8" y="10" width="48" height="46" rx="2" stroke="currentColor" stroke-width="2.5"/>
            <line x1="8" y1="26" x2="56" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="40" x2="56" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="14" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="28" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="42" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="14" y="30" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
            <rect x="42" y="30" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
            <path d="M26 56V46H38V56" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="half-name">Business &amp; Office</span>
          <span class="half-sub">Commercial IT Services</span>
          <span class="half-arrow">Enter &rsaquo;</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    var REF_W = 1440;

    function scalePreview(half) {
      var iframe = half.querySelector('.half-preview');
      if (!iframe) return;
      var W     = half.offsetWidth;
      var H     = half.offsetHeight;
      var scale = W / REF_W;
      iframe.style.width     = REF_W + 'px';
      iframe.style.height    = Math.ceil(H / scale) + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
    }

    function injectFlash(color) {
      var el = document.createElement('div');
      el.setAttribute('aria-hidden', 'true');
      el.style.cssText = [
        'position:fixed',
        'inset:0',
        'z-index:200',
        'pointer-events:none',
        'background:' + color,
        'animation:flash-out 0.35s ease-out forwards'
      ].join(';');
      document.body.appendChild(el);
      el.addEventListener('animationend', function() { el.parentNode && el.parentNode.removeChild(el); });
    }

    function selectHalf(half) {
      var chooser = document.getElementById('chooser');
      if (chooser.classList.contains('has-selection')) return;

      var dest      = half.dataset.href;
      var isRes     = half.classList.contains('half--residential');
      var flashColor = isRes
        ? 'rgba(212,114,42,0.22)'
        : 'rgba(91,94,204,0.22)';

      // 1. Inject full-screen flash for immediate "confirmed" feedback
      injectFlash(flashColor);

      // 2. Hide the other panel
      chooser.classList.add('has-selection');

      // 3. Snapshot card position before any layout change
      var cardRect = half.getBoundingClientRect();

      // 4. Expand to fixed fullscreen
      half.classList.add('is-selecting');
      var fullRect = half.getBoundingClientRect();

      // 5. FLIP: compute the inverse transform (visually starts at card position)
      var sx = cardRect.width  / fullRect.width;
      var sy = cardRect.height / fullRect.height;
      var tx = cardRect.left   - fullRect.left;
      var ty = cardRect.top    - fullRect.top;

      // Apply the starting (inverted) state — keep rounded corners at start
      half.style.borderRadius = '0px';
      half.style.transition   = 'none';
      half.style.transform    = 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')';

      // Force reflow so browser registers starting state
      void half.offsetHeight;

      // Re-scale the iframe for the now-fullscreen panel
      scalePreview(half);

      // 6. Animate to fullscreen — expo-out easing for game-like explosive feel
      half.style.transition = 'transform 0.36s cubic-bezier(0.19,1,0.22,1)';
      half.style.transform  = 'translate(0,0) scale(1,1)';

      // 7. Fly the header bubble to the top-left nav position
      var header  = document.querySelector('.header');
      var divider = header.querySelector('.header-divider');
      var tagline = header.querySelector('.header-tagline');

      header.style.transition = [
        'left 0.52s cubic-bezier(0.25,0.46,0.45,0.94)',
        'top 0.44s cubic-bezier(0.25,0.46,0.45,0.94)',
        'transform 0.52s cubic-bezier(0.25,0.46,0.45,0.94)'
      ].join(',');
      header.style.left      = '32px';
      header.style.top       = '16px';
      header.style.transform = 'none';

      // Tagline + divider fade out early in the flight
      setTimeout(function() {
        divider.style.transition = 'opacity 0.18s ease';
        tagline.style.transition = 'opacity 0.18s ease';
        divider.style.opacity    = '0';
        tagline.style.opacity    = '0';
      }, 130);

      // Flag destination page to play receiving animation
      sessionStorage.setItem('fromLanding', '1');

      // Navigate once bubble flight completes
      setTimeout(function() {
        window.location.href = dest;
      }, 600);
    }

    function resetState() {
      // Clear all selection state — needed when browser restores page from bfcache
      var chooser = document.getElementById('chooser');
      chooser.classList.remove('has-selection');
      document.querySelectorAll('.half').forEach(function(half) {
        half.classList.remove('is-selecting');
        half.removeAttribute('style');
      });
      document.querySelectorAll('.half').forEach(scalePreview);

      // Reset header bubble back to centered position (no transition — snap immediately)
      var header = document.querySelector('.header');
      header.style.transition = 'none';
      header.style.left       = '50%';
      header.style.top        = '18px';
      header.style.transform  = 'translateX(-50%)';
      var divider = header.querySelector('.header-divider');
      var tagline = header.querySelector('.header-tagline');
      divider.style.transition = 'none';
      tagline.style.transition = 'none';
      divider.style.opacity    = '';
      tagline.style.opacity    = '';
    }

    function init() {
      var halves = document.querySelectorAll('.half');

      halves.forEach(function(half) {
        scalePreview(half);

        half.addEventListener('click', function() { selectHalf(this); });
        half.addEventListener('keydown', function(e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectHalf(this);
          }
        });
      });

      window.addEventListener('resize', function() {
        halves.forEach(scalePreview);
      });

      // When the back button restores this page from bfcache, reset the
      // selection animation so the chooser is clean and interactive again
      window.addEventListener('pageshow', function(e) {
        if (e.persisted) resetState();
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>

</body>
</html>
