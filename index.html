<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: "Manrope", sans-serif;
      background: radial-gradient(ellipse at 50% 40%, #1a1a2e 0%, #080810 100%);
    }
    a { text-decoration: none; color: inherit; }

    /* ── Header ── */
    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 0;
      pointer-events: none; /* pass-through: remove if header gains interactive children */
    }
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-logo img {
      height: 44px;
      width: auto;
    }
    .header-name {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .header-tagline {
      margin-top: 4px;
      font-size: 0.8rem;
      font-weight: 500;
      color: rgba(255,255,255,0.6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* ── Chooser ── */
    @keyframes chooser-fade-in {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }
    .chooser {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      gap: 20px;
      /* Padding creates real dark space around and between the panels */
      padding: 110px 56px 52px;
      overflow: hidden; /* clips the click-zoom */
      animation: chooser-fade-in 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    }

    /* ── Halves ── */
    .half {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      cursor: pointer;
      overflow: hidden;
      border-radius: 20px;
      z-index: 1;
      /* Transparent baseline — body shows through, colored border marks the card */
      background-color: rgba(0,0,0,0);
      will-change: transform, background-color;
      transition:
        background-color 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        transform        0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
        border-color     0.4s ease,
        border-radius    0.2s ease;
    }
    /* Colored border outlines the card in its panel color even when transparent */
    .half--residential { border: 1px solid rgba(201,169,110,0.35); }
    .half--business    { border: 1px solid rgba(59,130,246,0.30);  }

    /* SVG divider doesn't suit the card layout — hidden */
    .divider { display: none; }

    /* ── Half content ── */
    .half-icon {
      width: 72px;
      height: 72px;
      opacity: 0.85;
    }
    .half-label {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .half--residential .half-label { color: #C9A96E; }
    .half--business    .half-label { color: #3B82F6; }
    .half-sub {
      font-size: 0.85rem;
      font-weight: 500;
      opacity: 0.6;
      color: #fff;
      text-align: center;
    }

    /* ── Keyboard focus ── */
    .half:focus-visible {
      outline: 3px solid #fff;
      outline-offset: -3px;
    }

    /* ── Hover: active half fills with its color, other stays transparent ── */
    .half--residential:hover { background-color: rgba(21,39,77,1);  border-color: rgba(201,169,110,0.7); transform: scale(1.03); z-index: 3; }
    .half--business:hover    { background-color: rgba(28,28,46,1);  border-color: rgba(59,130,246,0.6);  transform: scale(1.03); z-index: 3; }
    .chooser:has(.half:hover) .half:not(:hover) {
      transform: scale(0.97);
      border-color: rgba(255,255,255,0.06);
    }

    /* ── Click / zoom-select: panel expands to fill screen then navigates ── */
    .half--residential.selected { background-color: #15274D; }
    .half--business.selected    { background-color: #1C1C2E; }
    .half.selected {
      transform: scale(9);
      border-radius: 0;
      z-index: 20;
      transition:
        background-color 0.1s  ease,
        transform        0.42s cubic-bezier(0.4, 0, 0.15, 1),
        border-radius    0.15s ease;
    }

    /* ── Responsive: mobile stacks vertically ── */
    @media (max-width: 767px) {
      html, body { overflow: auto; }
      .chooser {
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        padding: 100px 24px 32px;
        gap: 16px;
      }
      .half { min-height: 44vh; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-logo">
      <img src="assets/logo.png" alt="Local Logic IT logo" />
      <span class="header-name">Local Logic IT</span>
    </div>
    <p class="header-tagline">Local Service. Logical Solutions.</p>
  </header>

  <main class="chooser" id="chooser">

    <!-- Residential half -->
    <a class="half half--residential" href="residential.html" aria-label="Go to Residential services">
      <!-- House icon -->
      <svg class="half-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 34L36 10L62 34" stroke="#C9A96E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M18 28V58H30V44H42V58H54V28" stroke="#C9A96E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="half-label">Home &amp; Family</span>
      <span class="half-sub">Residential IT Support</span>
    </a>

    <!-- Curved SVG divider -->
    <svg class="divider" viewBox="0 0 120 900" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M60 0 C20 150, 100 300, 60 450 C20 600, 100 750, 60 900 L120 900 L120 0 Z" fill="#1C1C2E"/>
      <path d="M60 0 C20 150, 100 300, 60 450 C20 600, 100 750, 60 900" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" fill="none"/>
    </svg>

    <!-- Business half -->
    <a class="half half--business" href="business.html" aria-label="Go to Business services">
      <!-- Building icon -->
      <svg class="half-icon" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="12" y="14" width="48" height="44" rx="2" stroke="#3B82F6" stroke-width="4"/>
        <line x1="12" y1="28" x2="60" y2="28" stroke="#3B82F6" stroke-width="4"/>
        <line x1="36" y1="14" x2="36" y2="58" stroke="#3B82F6" stroke-width="4"/>
        <rect x="22" y="36" width="10" height="10" rx="1" fill="#3B82F6" opacity="0.5"/>
        <rect x="40" y="36" width="10" height="10" rx="1" fill="#3B82F6" opacity="0.5"/>
        <rect x="22" y="20" width="10" height="4" rx="1" fill="#3B82F6" opacity="0.4"/>
        <rect x="40" y="20" width="10" height="4" rx="1" fill="#3B82F6" opacity="0.4"/>
      </svg>
      <span class="half-label">Business &amp; Office</span>
      <span class="half-sub">Commercial IT Services</span>
    </a>

  </main>

  <script>
    // Intercept clicks: zoom the selected half to fill the screen, then navigate
    document.querySelectorAll('.half').forEach(function(half) {
      half.addEventListener('click', function(e) {
        e.preventDefault();
        var dest = this.getAttribute('href');
        this.classList.add('selected');
        setTimeout(function() { window.location.href = dest; }, 420);
      });
    });
  </script>
</body>
</html>
