<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Local Logic IT — Local Service. Logical Solutions. IT support for home and business." />
  <title>Local Logic IT — Choose Your Service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="assets/brand/favicon-32.png" />
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
  <meta name="theme-color" content="#232425" />
  <meta property="og:image" content="assets/brand/social-card.png" />
  <link rel="stylesheet" href="assets/css/site.css" />
  <script src="assets/js/site.js" defer></script>
</head>
<body class="landing-page">

  <!-- New Glassmorphism Nav Bar -->
  <div class="nav-wrapper">
    <div class="glass-stratum"></div>
    <nav class="nav glass-nav is-pill">
      <a href="index.html" class="nav-logo logo">
        <img src="assets/brand/local-logic-mark.svg" alt="Local Logic IT" class="logo-mark-svg" />
        <span class="nav-logo-name">Local Logic IT</span>
      </a>

      <div class="nav-links">
        <a href="residential.html#services" class="nav-item"><span>01</span>Services</a>
        <a href="residential.html#about" class="nav-item"><span>02</span>About</a>
        <a href="residential.html#contact" class="nav-item"><span>03</span>Contact</a>
      </div>
    </nav>
  </div>

  <main class="chooser" id="chooser">

    <!-- Residential preview panel -->
    <div class="half half--residential"
         role="link" tabindex="0"
         aria-label="Residential IT Support — Home and Family"
         data-href="residential.html">
      <iframe class="half-preview"
              src="residential.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Residential site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="caption-wrapper caption-wrapper--residential">
        <div class="half-caption caption-inner">
          <!-- House icon -->
          <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M6 30L32 8L58 30" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 25V56H26V42C26 40.895 26.895 40 28 40H36C37.105 40 38 40.895 38 42V56H52V25" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="18" y="32" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.18"/>
            <rect x="37" y="32" width="9" height="8" rx="1.5" stroke="currentColor" stroke-width="2" fill="currentColor" fill-opacity="0.18"/>
          </svg>
          <span class="half-name">Home &amp; Family</span>
          <span class="half-sub">Residential IT Support</span>
          <span class="half-arrow">Enter &rsaquo;</span>
        </div>
      </div>
    </div>

    <!-- Business preview panel -->
    <div class="half half--business"
         role="link" tabindex="0"
         aria-label="Business IT Services — Business and Office"
         data-href="business.html">
      <iframe class="half-preview"
              src="business.html"
              loading="lazy"
              scrolling="no"
              tabindex="-1"
              aria-hidden="true"
              title="Business site preview"></iframe>
      <div class="half-overlay"></div>
      <div class="caption-wrapper caption-wrapper--business">
        <div class="half-caption caption-inner">
          <!-- Office building icon -->
          <svg class="half-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="8" y="10" width="48" height="46" rx="2" stroke="currentColor" stroke-width="2.5"/>
            <line x1="8" y1="26" x2="56" y2="26" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="8" y1="40" x2="56" y2="40" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="14" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="28" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="42" y="14" width="8" height="8" rx="1" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.5"/>
            <rect x="14" y="30" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
            <rect x="42" y="30" width="8" height="7" rx="1" fill="currentColor" fill-opacity="0.18" stroke="currentColor" stroke-width="1.5"/>
            <path d="M26 56V46H38V56" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="half-name">Business &amp; Office</span>
          <span class="half-sub">Commercial IT Services</span>
          <span class="half-arrow">Enter &rsaquo;</span>
        </div>
      </div>
    </div>

  </main>

  <!-- New inline script for landing page specific JS -->
  <script>
    // Subtle Refraction Movement (adapted for Local Logic IT)
    const navWrapper = document.querySelector('.nav-wrapper');
    const glassNav = document.querySelector('.glass-nav');

    if (navWrapper && glassNav) {
      window.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 75;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 75;
        glassNav.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
      });

      window.addEventListener('mouseleave', () => {
        glassNav.style.transform = `rotateY(0deg) rotateX(0deg)`;
      });

      // Scroll Depth Effect (adapted for Local Logic IT)
      window.addEventListener('scroll', () => {
        const scrolled = window.scrollY;
        if(scrolled > 50) {
          navWrapper.style.width = '85%';
          glassNav.style.padding = '0.5rem 1.5rem';
          glassNav.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
        } else {
          navWrapper.style.width = '90%';
          glassNav.style.padding = '0.75rem 1.5rem';
          glassNav.style.backgroundColor = 'rgba(255, 255, 255, 0.03)';
        }
      });
    }

    // Original landing page script functionality, adapted for new header
    function scalePreview(half) {
      if (window.LocalLogicLanding) {
        window.LocalLogicLanding.scalePreview(half);
        return;
      }
      // This function scales the iframe previews. It's independent of the header.
      const iframe = half.querySelector('.half-preview');
      if (!iframe) return;
      const halfWidth = half.offsetWidth;
      const halfHeight = half.offsetHeight;
      const iframeWidth = 1440; // Assuming a desktop width for the iframe content
      const iframeHeight = 900; // Assuming a desktop height for the iframe content

      const scaleX = halfWidth / iframeWidth;
      const scaleY = halfHeight / iframeHeight;
      const scale = Math.max(scaleX, scaleY); // Scale to cover the area

      iframe.style.transform = `scale(${scale})`;
      iframe.style.width = `${iframeWidth}px`;
      iframe.style.height = `${iframeHeight}px`;
    }

    function selectHalf(half) {
      if (window.LocalLogicLanding) {
        window.LocalLogicLanding.select(half);
        return;
      }
      const targetUrl = half.dataset.href;
      if (!targetUrl) return;

      const navWrapper = document.querySelector('.nav-wrapper');
      if (navWrapper) {
        navWrapper.classList.add('is-leaving'); // Trigger exit animation
      }

      sessionStorage.setItem('fromLanding', half.classList.contains('half--residential') ? 'residential' : 'business');

      // Allow animation to start before navigating
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 600); // Match this with the CSS transition duration for .is-leaving
    }

    function resetState() {
      if (window.LocalLogicLanding) {
        window.LocalLogicLanding.reset();
        return;
      }
      // Clear all selection state — needed when browser restores page from bfcache
      var chooser = document.getElementById('chooser');
      if (!chooser) return;
      chooser.classList.remove('has-selection', 'selecting-residential', 'selecting-business');
      document.querySelectorAll('.half').forEach(function(half) {
        half.classList.remove('is-selected', 'is-clicked');
        half.removeAttribute('style');
      });
      document.querySelectorAll('.half').forEach(scalePreview);

      // Reset new header state if needed (e.g., remove is-leaving class)
      const navWrapper = document.querySelector('.nav-wrapper');
      if (navWrapper) {
        navWrapper.classList.remove('is-leaving');
      }
    }

    function initLandingPage() {
      var halves = document.querySelectorAll('.half');
      halves.forEach(function(half) {
        scalePreview(half);
        half.onclick = function() { selectHalf(this); };
      });
    }

    // Initial load
    window.addEventListener('load', function() {
      initLandingPage();
    });

    window.addEventListener('resize', function() {
      document.querySelectorAll('.half').forEach(scalePreview);
    });

    window.addEventListener('pageshow', function(e) {
      if (e.persisted) resetState();
    });
  </script>

</body>
</html>
